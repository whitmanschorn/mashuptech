[project]
name = "mashuptech"
version = "0.1.0"
description = "Drop-folder stem separation pipeline (acapella / drums / instrumental) for Ableton mashups"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "demucs>=4.1.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "librosa>=0.10.2",
    "mutagen>=1.47",
    "imageio-ffmpeg>=0.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mashuptech = "mashuptech.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mashuptech"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# demucs pins old torch on Intel macs; we only target Apple Silicon and Linux.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]
